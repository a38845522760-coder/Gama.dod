name: Iron Yard - build content packs

# Builds the downloadable maps/weapons/characters (.pck) and manifest.json, then uploads them to the
# "content-v1" release. The game downloads them from there. Run it manually (Actions tab -> Run workflow).
#
#   inspect_assets = true  : only prints what is inside the zips of release assets-v1 (no build).
#                            Paste that list in chat so the real models can be turned into packs.
#   inspect_assets = false : builds every pack found in content_src/ of the project ZIP.

on:
  workflow_dispatch:
    inputs:
      inspect_assets:
        description: "Only list what is inside the assets-v1 release zips (no build)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: iron-yard-content
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1"
  GODOT_RELEASE: "4.4.1-stable"
  CONTENT_TAG: "content-v1"
  ASSETS_TAG: "assets-v1"

jobs:
  inspect-assets:
    if: ${{ inputs.inspect_assets }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the zips from the assets release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$ASSETS_TAG" --repo "$GITHUB_REPOSITORY" -p "*.zip" -D dl
          ls -lh dl

      - name: List contents into the job summary
        shell: bash
        run: |
          set +e
          for z in dl/*.zip; do
            {
              echo "## $(basename "$z")"
              echo "### file types"
              echo '```'
              unzip -Z1 "$z" | grep -v '/$' | sed -E 's/.*\.([A-Za-z0-9]+)$/\1/' | tr 'A-Z' 'a-z' | sort | uniq -c | sort -rn | head -20
              echo '```'
              echo "### first 400 entries"
              echo '```'
              unzip -Z1 "$z" | head -400
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY" | head -60

  build-packs:
    if: ${{ !inputs.inspect_assets }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP (temporary, not committed)
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=""
          for candidate in IronYard_Phase2_RepoRoot.zip IronYard_Phase1_RepoRoot.zip; do
            if [[ -f "$candidate" ]]; then ARCHIVE="$candidate"; break; fi
          done
          if [[ -z "$ARCHIVE" ]]; then
            echo "::error::Iron Yard ZIP was not found in the repository root."; exit 1
          fi
          PROJECT_DIR="$RUNNER_TEMP/iron-yard"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ARCHIVE" -d "$PROJECT_DIR"
          if [[ ! -d "$PROJECT_DIR/content_src" ]]; then
            echo "::error::content_src/ is missing in the project ZIP."; exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cache Godot binary and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android-v1

      - name: Install Godot and Android export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-bin"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/android_*' 'templates/version.txt' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Prepare Godot on PATH
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK components
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "cmdline-tools;latest" "platform-tools" \
            "build-tools;34.0.0" "build-tools;35.0.1" \
            "platforms;android-34" "platforms;android-35" >/dev/null || true

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_PATH}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GODOT_ANDROID_KEYSTORE_DEBUG_PATH}"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^          //' "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Fetch the current manifest (so unchanged packs are kept)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/packs
          gh release download "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" -p manifest.json -D build/packs || echo "No previous manifest (first run)."

      - name: Build packs
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/build_packs.py" --src "$PROJECT_DIR/content_src" --out build/packs --work "$RUNNER_TEMP/packwork" --godot godot

      - name: Upload packs to the content release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" --title "Iron Yard content" \
              --notes "Downloadable content packs for the game (maps, weapons, characters)." --latest=false
          gh release upload "$CONTENT_TAG" build/packs/* --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### Content packs"
            echo '```'
            ls -lh build/packs
            echo '```'
            echo "Manifest: https://github.com/$GITHUB_REPOSITORY/releases/download/$CONTENT_TAG/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronYard-content-packs
          path: build/packs
          retention-days: 14
