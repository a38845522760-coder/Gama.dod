name: Iron Yard - build downloadable map content

# Builds only map/environment packs from content_src/ and publishes the
# content-v1 release, which ContentManager reads for manifest.json.
# Runs automatically when the project ZIP or this workflow changes.

on:
  push:
    branches: [main]
    paths:
      - 'IronYard_Phase2_RepoRoot.zip'
      - '.github/workflows/build-content.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iron-yard-map-content
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.4.1"
  GODOT_RELEASE: "4.4.1-stable"
  CONTENT_TAG: "content-v1"

jobs:
  build-map-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP in runner temp
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="IronYard_Phase2_RepoRoot.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Project ZIP not found at repository root: $ARCHIVE"
            exit 1
          fi
          PROJECT_DIR="$RUNNER_TEMP/iron-yard"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ARCHIVE" -d "$PROJECT_DIR"
          test -d "$PROJECT_DIR/content_src" || {
            echo "::error::content_src/ is missing inside the project ZIP."
            exit 1
          }
          test -f "$PROJECT_DIR/tools/build_packs.py" || {
            echo "::error::tools/build_packs.py is missing inside the project ZIP."
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Select map packs only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/iron-yard/content_src" "$RUNNER_TEMP/map-content-src" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          destination.mkdir(parents=True, exist_ok=True)
          selected = []
          for folder in sorted(source.iterdir()):
              config_file = folder / "pack.json"
              if not folder.is_dir() or not config_file.is_file():
                  continue
              config = json.loads(config_file.read_text(encoding="utf-8"))
              if str(config.get("type", "other")) != "map":
                  print(f"Skipping non-map pack: {folder.name}")
                  continue
              if config.get("id") != folder.name:
                  raise SystemExit(f"{folder.name}: pack.json id must match folder name")
              shutil.copytree(folder, destination / folder.name)
              selected.append(folder.name)
          if not selected:
              raise SystemExit("No map packs found in content_src/.")
          print("Selected map packs:", ", ".join(selected))
          PY
          echo "MAP_SRC=$RUNNER_TEMP/map-content-src" >> "$GITHUB_ENV"

      - name: Cache Godot binary and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android-map-packs-v1

      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-bin"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/android_*' 'templates/version.txt' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Prepare Godot on PATH
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          test -x "$GODOT_BIN" || chmod +x "$GODOT_BIN"
          ln -sf "$GODOT_BIN" "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Fetch previous manifest and retain map entries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/packs
          if gh release view "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern manifest.json --dir build/packs || true
          fi
          if [[ -s build/packs/manifest.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("build/packs/manifest.json")
          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          maps = [
              item for item in data.get("packs", [])
              if isinstance(item, dict) and item.get("type") == "map"
          ]
          manifest_path.write_text(
              json.dumps({"schema": 1, "packs": maps}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
          fi

      - name: Build map PCK files and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/build_packs.py" \
            --src "$MAP_SRC" \
            --out build/packs \
            --work "$RUNNER_TEMP/packwork" \
            --godot godot
          python3 -m json.tool build/packs/manifest.json >/dev/null
          ls -lh build/packs

      - name: Publish map packs to content-v1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$CONTENT_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Iron Yard downloadable maps" \
              --notes "Downloadable map and environment content for Iron Yard." \
              --latest=false
          gh release upload "$CONTENT_TAG" build/packs/*.pck build/packs/manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "### Published map content" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh build/packs >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest URL: https://github.com/$GITHUB_REPOSITORY/releases/download/$CONTENT_TAG/manifest.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Keep build output as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronYard-map-content-packs
          path: build/packs/
          retention-days: 14
