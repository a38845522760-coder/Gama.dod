name: Keep Iron Yard as ZIP only

on:
  push:
    paths:
      - 'IronYard_Phase2_RepoRoot.zip'
      - 'IronYard_Phase1_RepoRoot.zip'
      - '.github/workflows/extract-project-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iron-yard-zip-only
  cancel-in-progress: false

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ZIP without extracting it
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=""
          for candidate in IronYard_Phase2_RepoRoot.zip IronYard_Phase1_RepoRoot.zip; do
            if [[ -f "$candidate" ]]; then
              ARCHIVE="$candidate"
              break
            fi
          done
          if [[ -z "$ARCHIVE" ]]; then
            echo "::error::Iron Yard ZIP was not found in the repository root."
            exit 1
          fi

          unzip -t "$ARCHIVE"
          if ! unzip -Z1 "$ARCHIVE" | grep -qx 'project.godot'; then
            echo "::error::project.godot must be directly at the ZIP root."
            exit 1
          fi
          echo "ZIP is valid. It has NOT been extracted."

      - name: Remove previously extracted project files from Git
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch             assets data docs scenes scripts tests             project.godot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No extracted project files need removal."
          else
            git commit -m "Keep Iron Yard project as ZIP only"
            git push
          fi
