name: Extract Iron Yard project ZIP

on:
  push:
    paths:
      - 'IronYard_Phase1_RepoRoot.zip'
      - 'IronYard_Phase2_RepoRoot.zip'
      - 'IronYard_Phase3_RepoRoot.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iron-yard-zip-extractor
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "IronYard_Phase3_RepoRoot.zip" ]]; then
            ARCHIVE="IronYard_Phase3_RepoRoot.zip"
          elif [[ -f "IronYard_Phase2_RepoRoot.zip" ]]; then
            ARCHIVE="IronYard_Phase2_RepoRoot.zip"
          elif [[ -f "IronYard_Phase1_RepoRoot.zip" ]]; then
            ARCHIVE="IronYard_Phase1_RepoRoot.zip"
          else
            echo "::error::No supported Iron Yard project ZIP found in repository root."
            exit 1
          fi
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          while IFS= read -r entry; do
            normalized="${entry%/}"
            if [[ "$normalized" == /* || "$normalized" == ".." || "$normalized" == ../* || "$normalized" == */../* || "$normalized" == */.. ]]; then
              echo "::error::Unsafe ZIP entry: $entry"
              exit 1
            fi
          done < <(unzip -Z1 "$ARCHIVE")
          unzip -q "$ARCHIVE" -d "$TEMP_DIR"
          if [[ ! -f "$TEMP_DIR/project.godot" ]]; then
            echo "::error::project.godot was not found at the archive root."
            exit 1
          fi
          cp -a "$TEMP_DIR/." .
          echo "Extracted $ARCHIVE successfully."

      - name: Commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Extract Iron Yard Phase 3 (modes, AI, shop)"
            git push
          fi
