name: Build Iron Yard Android APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - ".github/workflows/iron-yard.yml"

permissions:
  contents: write

concurrency:
  group: iron-yard-apk
  cancel-in-progress: false

env:
  SOURCE_TAG: "phase2-source-v2"
  SOURCE_ZIP: "IronYard_Phase2_RepoRoot.zip"
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download source ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/$SOURCE_ZIP"
          echo "ARCHIVE=$RUNNER_TEMP/source/$SOURCE_ZIP" >> "$GITHUB_ENV"

      - name: Validate and extract Godot project
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ARCHIVE"
          if ! unzip -Z1 "$ARCHIVE" | grep -qx 'project.godot'; then
            echo "::error::project.godot must be at the ZIP root."
            exit 1
          fi
          while IFS= read -r entry; do
            n="${entry%/}"
            if [[ "$n" == /* || "$n" == ".." || "$n" == ../* || "$n" == */../* || "$n" == */.. ]]; then
              echo "::error::Unsafe ZIP entry: $entry"
              exit 1
            fi
          done < <(unzip -Z1 "$ARCHIVE")
          PROJECT_DIR="$RUNNER_TEMP/iron-yard"
          mkdir -p "$PROJECT_DIR"
          unzip -q "$ARCHIVE" -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/scenes/industrial_arena_showcase.tscn"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Cache Godot and Android export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-android-templates-v1

      - name: Install Godot and Android export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}"
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -O "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$HOME/godot-bin"
          wget -q "$BASE/Godot_v${GODOT_RELEASE}_export_templates.tpz" -O "$RUNNER_TEMP/templates.tpz"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" \
            'templates/android_*' 'templates/version.txt' \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -f "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"

      - name: Prepare Godot
        shell: bash
        run: |
          set -euo pipefail
          ln -sf "$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_PATH=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "cmdline-tools;latest" "platform-tools" \
            "build-tools;35.0.1" "platforms;android-35" >/dev/null || true

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_PATH}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Android export preset
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/IronYard-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.ironyard.showcase"
          package/name="Iron Yard"
          package/signed=true
          package/app_category=2
          package/retain_data_on_uninstall=false
          package/exclude_from_recents=false
          graphics/opengl_debug=false
          xr_features/xr_mode=0
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          apk_expansion/enable=false
          permissions/internet=true
          permissions/vibrate=true
          permissions/access_network_state=true
          EOF

      - name: Import project resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          timeout 300 godot --headless --editor --path . --import --quit 2>&1 | tee import.log

      - name: Export Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/IronYard-debug.apk 2>&1 | tee export.log
          test -s build/IronYard-debug.apk
          ls -lh build/IronYard-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IronYard-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/IronYard-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" "$PROJECT_DIR/build/IronYard-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "Iron Yard Android APK #${{ github.run_number }}" \
            --notes "Android APK built from the standalone Iron Yard Visual Overhaul Godot project."
